spring.application.name=logistics-system
server.port=8080

# Spring Boot does not load .env files implicitly. Support both common launch
# directories: repository root and backend/.
spring.config.import=classpath:application-logistics.properties,classpath:application-security.properties,optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Default local profile. For production run with SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database - common URL/driver. Credentials are profile-specific or local overrides.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Logistics;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Inventory count snapshot insert performance.
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_JDBC_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway owns database schema and seed migrations.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=dbo
spring.flyway.default-schema=dbo
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Cleaner console
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=INFO

# Operational attachment uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
logistics.attachments.storage-directory=${LOGISTICS_ATTACHMENTS_STORAGE_DIRECTORY:uploads/operational-attachments}

# Performance safety: keep heavy lifecycle schedulers away from normal page loads.
app.lifecycle.monitoring-delay-ms=1800000
app.lifecycle.monitoring-initial-delay-ms=1800000
app.lifecycle.notification-escalation-delay-ms=1800000
app.lifecycle.notification-escalation-initial-delay-ms=1800000
app.lifecycle.shift-status-delay-ms=1800000
app.lifecycle.shift-status-initial-delay-ms=1800000
