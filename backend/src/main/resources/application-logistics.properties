logistics.status-transitions.vehicle.MAINTENANCE=AVAILABLE,OUT_OF_SERVICE
logistics.status-transitions.vehicle.OUT_OF_SERVICE=MAINTENANCE,AVAILABLE

logistics.status-transitions.stock-movement.DRAFT=PENDING_APPROVAL,EXECUTED,CANCELLED
logistics.status-transitions.stock-movement.PENDING_APPROVAL=APPROVED,REJECTED,CANCELLED
