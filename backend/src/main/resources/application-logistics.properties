logistics.status-transitions.inventory-count.REVIEW=APPROVED,REJECTED,COUNTING,CANCELLED
logistics.status-transitions.inventory-count.APPROVED=ADJUSTMENTS_CREATED,CANCELLED
logistics.status-transitions.inventory-count.ADJUSTMENTS_CREATED=CLOSED
logistics.status-transitions.inventory-count.CLOSED=
